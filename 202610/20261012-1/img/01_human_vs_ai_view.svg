<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="'Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans CJK JP',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>

  <!-- 左：ファイル -->
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#1e293b">ファイルの中身</text>
  <rect x="20" y="44" width="240" height="356" rx="8" fill="#f8fafc" stroke="#94a3b8"/>

  <text x="36" y="74" font-size="14" font-weight="bold" fill="#1e293b">文字のデータ</text>
  <rect x="36" y="84" width="208" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="104" font-size="13" fill="#1e293b">本文</text>
  <rect x="36" y="120" width="208" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="140" font-size="13" fill="#1e293b">本文</text>
  <rect x="36" y="156" width="208" height="30" rx="4" fill="#fff7ed" stroke="#f97316" stroke-dasharray="4 3"/>
  <text x="48" y="176" font-size="13" fill="#9a3412">見えにくい文字</text>

  <text x="36" y="232" font-size="14" font-weight="bold" fill="#1e293b">見せ方の情報</text>
  <rect x="36" y="242" width="208" height="64" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="266" font-size="13" fill="#334155">色・大きさ・位置など</text>
  <text x="48" y="290" font-size="12" fill="#9a3412">例：白い背景に白い文字</text>

  <text x="36" y="340" font-size="12" fill="#475569">文字と見せ方は、</text>
  <text x="36" y="360" font-size="12" fill="#475569">別々の情報として入っている</text>

  <!-- 上段：人 -->
  <line x1="260" y1="140" x2="480" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="112" font-size="13" fill="#475569">見せ方に沿って表示</text>

  <text x="490" y="30" font-size="16" font-weight="bold" fill="#1e293b">人が見るもの</text>
  <rect x="490" y="44" width="250" height="150" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="506" y="62" width="218" height="30" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="518" y="82" font-size="13" fill="#1e293b">本文</text>
  <rect x="506" y="98" width="218" height="30" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="518" y="118" font-size="13" fill="#1e293b">本文</text>
  <text x="615" y="160" text-anchor="middle" font-size="12" fill="#94a3b8">（見えにくい文字は目に入らない）</text>

  <!-- 下段：AI -->
  <line x1="260" y1="172" x2="480" y2="320" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="268" y="290" font-size="13" fill="#475569">文字だけを取り出す</text>

  <text x="490" y="236" font-size="16" font-weight="bold" fill="#1e293b">AIに渡るもの</text>
  <rect x="490" y="250" width="250" height="150" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <rect x="506" y="268" width="218" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="518" y="288" font-size="13" fill="#1e293b">本文</text>
  <rect x="506" y="304" width="218" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="518" y="324" font-size="13" fill="#1e293b">本文</text>
  <rect x="506" y="340" width="218" height="30" rx="4" fill="#fff7ed" stroke="#f97316"/>
  <text x="518" y="360" font-size="13" fill="#9a3412">見えにくい文字</text>
  <text x="615" y="390" text-anchor="middle" font-size="12" fill="#475569">ほかの本文と同じ、普通の文字</text>
</svg>
