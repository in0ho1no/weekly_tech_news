<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="'Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans CJK JP',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#ffffff"/>

  <!-- 左：依頼と文書 -->
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#1e293b">利用者の依頼</text>
  <rect x="20" y="44" width="220" height="44" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="130" y="72" text-anchor="middle" font-size="14" fill="#1e293b">「この文書を要約して」</text>

  <text x="20" y="130" font-size="16" font-weight="bold" fill="#1e293b">要約の材料（文書の内容）</text>
  <rect x="20" y="144" width="220" height="236" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="36" y="162" width="188" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="182" font-size="13" fill="#1e293b">本文</text>
  <rect x="36" y="198" width="188" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="218" font-size="13" fill="#1e293b">本文</text>
  <rect x="36" y="250" width="188" height="44" rx="4" fill="#fff7ed" stroke="#f97316" stroke-dasharray="4 3"/>
  <text x="48" y="268" font-size="13" fill="#9a3412">見えにくい文字</text>
  <text x="48" y="286" font-size="12" fill="#9a3412">（スキルや職歴などの情報）</text>
  <rect x="36" y="302" width="188" height="44" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="4 3"/>
  <text x="48" y="320" font-size="13" fill="#991b1b">見えにくい文字</text>
  <text x="48" y="338" font-size="12" fill="#991b1b">（AIへの命令文）</text>

  <!-- 合流 -->
  <line x1="240" y1="66" x2="306" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="262" x2="306" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 中央：AIへの入力 -->
  <text x="310" y="110" font-size="16" font-weight="bold" fill="#1e293b">AIへの入力</text>
  <rect x="310" y="124" width="170" height="104" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="395" y="160" text-anchor="middle" font-size="13" fill="#1e293b">依頼と材料が</text>
  <text x="395" y="182" text-anchor="middle" font-size="13" fill="#1e293b">まとめて</text>
  <text x="395" y="204" text-anchor="middle" font-size="13" fill="#1e293b">1つの入力になる</text>

  <line x1="480" y1="176" x2="530" y2="176" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 右：起こりうること -->
  <text x="540" y="30" font-size="16" font-weight="bold" fill="#1e293b">AIの受け取り方</text>
  <rect x="540" y="44" width="200" height="88" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="556" y="72" font-size="13" font-weight="bold" fill="#1e293b">依頼</text>
  <text x="556" y="96" font-size="12" fill="#334155">従うべき指示として</text>
  <text x="556" y="116" font-size="12" fill="#334155">扱われる</text>

  <rect x="540" y="146" width="200" height="88" rx="8" fill="#fff7ed" stroke="#f97316"/>
  <text x="556" y="174" font-size="13" font-weight="bold" fill="#9a3412">情報</text>
  <text x="556" y="198" font-size="12" fill="#334155">判断材料に</text>
  <text x="556" y="218" font-size="12" fill="#334155">加わることがある</text>

  <rect x="540" y="248" width="200" height="88" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="556" y="276" font-size="13" font-weight="bold" fill="#991b1b">命令文</text>
  <text x="556" y="300" font-size="12" fill="#334155">従うべき指示と</text>
  <text x="556" y="320" font-size="12" fill="#334155">取り違えられることがある</text>

  <text x="540" y="368" font-size="12" fill="#475569">本来、材料の中の命令文は</text>
  <text x="540" y="388" font-size="12" fill="#475569">要約する対象の一部にすぎない</text>
</svg>
