<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="'Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans CJK JP',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>

  <!-- ===== 個人用 ===== -->
  <text x="195" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">個人用（ホームフォルダ）</text>

  <!-- 自分のPC -->
  <rect x="20" y="46" width="350" height="214" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="36" y="70" font-size="13" fill="#475569">自分のPC</text>

  <!-- Skill -->
  <rect x="135" y="82" width="120" height="44" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="195" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Skill</text>

  <!-- リポジトリ群 -->
  <rect x="36" y="186" width="96" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="84" y="217" text-anchor="middle" font-size="13" fill="#1e293b">リポジトリA</text>
  <rect x="147" y="186" width="96" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="195" y="217" text-anchor="middle" font-size="13" fill="#1e293b">リポジトリB</text>
  <rect x="258" y="186" width="96" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="306" y="217" text-anchor="middle" font-size="13" fill="#1e293b">リポジトリC</text>

  <line x1="170" y1="126" x2="95" y2="183" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="195" y1="126" x2="195" y2="183" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="220" y1="126" x2="295" y2="183" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="195" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">効くのは自分だけ</text>
  <text x="195" y="312" text-anchor="middle" font-size="13" fill="#475569">どのリポジトリで作業していても候補に並ぶ</text>

  <!-- ===== プロジェクト用 ===== -->
  <text x="565" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">プロジェクト用（リポジトリの中）</text>

  <!-- リポジトリA -->
  <rect x="390" y="46" width="350" height="214" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="406" y="70" font-size="13" fill="#4338ca">リポジトリA</text>

  <!-- Skill -->
  <rect x="505" y="82" width="120" height="44" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="565" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Skill</text>

  <!-- メンバー -->
  <rect x="406" y="186" width="96" height="52" rx="8" fill="#ffffff" stroke="#6366f1"/>
  <text x="454" y="217" text-anchor="middle" font-size="13" fill="#1e293b">自分</text>
  <rect x="517" y="186" width="96" height="52" rx="8" fill="#ffffff" stroke="#6366f1"/>
  <text x="565" y="217" text-anchor="middle" font-size="13" fill="#1e293b">メンバー1</text>
  <rect x="628" y="186" width="96" height="52" rx="8" fill="#ffffff" stroke="#6366f1"/>
  <text x="676" y="217" text-anchor="middle" font-size="13" fill="#1e293b">メンバー2</text>

  <line x1="540" y1="126" x2="465" y2="183" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <line x1="565" y1="126" x2="565" y2="183" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <line x1="590" y1="126" x2="665" y2="183" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowAccent)"/>
  <rect x="660" y="140" width="40" height="22" rx="4" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="680" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#4338ca">Git</text>

  <text x="565" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">効くのはリポジトリを使う全員</text>
  <text x="565" y="312" text-anchor="middle" font-size="13" fill="#475569">直した内容はGitで全員に届く</text>
</svg>
