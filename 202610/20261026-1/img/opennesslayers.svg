<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="Meiryo, 'Yu Gothic UI', 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif">
  <rect width="800" height="440" fill="#ffffff"/>

  <!-- 見出し -->
  <text x="210" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">オープンウェイト</text>
  <text x="590" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">オープンソースAI（OSIの定義）</text>

  <!-- 左列 -->
  <rect x="60" y="56" width="300" height="62" rx="8" fill="#ffffff" stroke="#aaa" stroke-dasharray="6 4"/>
  <text x="210" y="83" text-anchor="middle" font-size="14" fill="#888">学習データの情報</text>
  <text x="210" y="103" text-anchor="middle" font-size="12" fill="#888">提供元によっては公開（条件ではない）</text>

  <rect x="60" y="130" width="300" height="62" rx="8" fill="#ffffff" stroke="#aaa" stroke-dasharray="6 4"/>
  <text x="210" y="157" text-anchor="middle" font-size="14" fill="#888">学習・実行のコード</text>
  <text x="210" y="177" text-anchor="middle" font-size="12" fill="#888">提供元によっては公開（条件ではない）</text>

  <rect x="60" y="204" width="300" height="62" rx="8" fill="#dbe8f7" stroke="#3b6ea8"/>
  <text x="210" y="241" text-anchor="middle" font-size="15" fill="#1f4e85">重み</text>

  <!-- 右列 -->
  <rect x="440" y="56" width="300" height="62" rx="8" fill="#dbe8f7" stroke="#3b6ea8"/>
  <text x="590" y="83" text-anchor="middle" font-size="14" fill="#1f4e85">学習データの情報</text>
  <text x="590" y="103" text-anchor="middle" font-size="12" fill="#1f4e85">出どころ・選び方・加工方法など</text>

  <rect x="440" y="130" width="300" height="62" rx="8" fill="#dbe8f7" stroke="#3b6ea8"/>
  <text x="590" y="157" text-anchor="middle" font-size="14" fill="#1f4e85">学習・実行のコード</text>
  <text x="590" y="177" text-anchor="middle" font-size="12" fill="#1f4e85">ソースコード一式</text>

  <rect x="440" y="204" width="300" height="62" rx="8" fill="#dbe8f7" stroke="#3b6ea8"/>
  <text x="590" y="241" text-anchor="middle" font-size="15" fill="#1f4e85">重み</text>

  <!-- できること -->
  <rect x="60" y="304" width="300" height="62" rx="8" fill="#f5f5f5" stroke="#ccc"/>
  <text x="210" y="331" text-anchor="middle" font-size="13" fill="#333">動かす</text>
  <text x="210" y="351" text-anchor="middle" font-size="13" fill="#333">追加で学習させる</text>

  <rect x="440" y="304" width="300" height="62" rx="8" fill="#f5f5f5" stroke="#ccc"/>
  <text x="590" y="331" text-anchor="middle" font-size="13" fill="#333">左に加えて</text>
  <text x="590" y="351" text-anchor="middle" font-size="13" fill="#333">作り方を確かめる・学習を再現する</text>

  <text x="60" y="296" font-size="12" fill="#666">できること</text>
  <text x="440" y="296" font-size="12" fill="#666">できること</text>

  <!-- 凡例 -->
  <rect x="150" y="400" width="26" height="16" rx="3" fill="#dbe8f7" stroke="#3b6ea8"/>
  <text x="184" y="413" font-size="12" fill="#444">公開が求められるもの</text>
  <rect x="400" y="400" width="26" height="16" rx="3" fill="#ffffff" stroke="#aaa" stroke-dasharray="4 3"/>
  <text x="434" y="413" font-size="12" fill="#444">呼び名の条件には含まれないもの</text>
</svg>
