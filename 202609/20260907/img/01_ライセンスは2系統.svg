<svg viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- 背景 -->
  <rect x="0" y="0" width="760" height="560" fill="#ffffff"/>

  <!-- タイトル -->
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">同じリポジトリでも、フォルダごとにライセンスが違う</text>
  <text x="380" y="60" text-anchor="middle" font-size="13" fill="#6b7280">anthropics/skills リポジトリの構成（一部抜粋）</text>

  <!-- リポジトリ枠 -->
  <rect x="40" y="80" width="680" height="420" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="64" y="110" font-size="15" font-weight="bold" fill="#374151">📁 anthropics/skills</text>
  <text x="88" y="136" font-size="13" fill="#4b5563">📄 README.md</text>
  <text x="210" y="136" font-size="12" fill="#9ca3af">← ライセンスが2系統あることを明記</text>
  <text x="88" y="162" font-size="14" font-weight="bold" fill="#374151">📁 skills/</text>

  <!-- Apache 2.0 グループ -->
  <rect x="104" y="178" width="300" height="150" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="122" y="204" font-size="13" fill="#065f46">📁 algorithmic-art</text>
  <text x="122" y="228" font-size="13" fill="#065f46">📁 mcp-server</text>
  <text x="122" y="252" font-size="13" fill="#065f46">📁 skill-creator</text>
  <text x="122" y="276" font-size="13" fill="#065f46">📁 webapp-testing</text>
  <text x="122" y="302" font-size="12" fill="#059669">…ほか多数</text>

  <!-- Apache 説明パネル -->
  <rect x="428" y="178" width="272" height="150" rx="8" fill="#f0fdf4" stroke="#34d399" stroke-width="1.5"/>
  <text x="444" y="206" font-size="14" font-weight="bold" fill="#047857">Apache 2.0（オープンソース）</text>
  <text x="444" y="234" font-size="12.5" fill="#065f46">条件（著作権表示の保持など）を</text>
  <text x="444" y="254" font-size="12.5" fill="#065f46">守れば、利用・改変・再配布が</text>
  <text x="444" y="274" font-size="12.5" fill="#065f46">広く認められている</text>
  <line x1="404" y1="253" x2="428" y2="253" stroke="#34d399" stroke-width="1.5"/>

  <!-- source-available グループ -->
  <rect x="104" y="344" width="300" height="132" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="122" y="370" font-size="13" fill="#9a3412">📁 docx</text>
  <text x="122" y="394" font-size="13" fill="#9a3412">📁 pdf</text>
  <text x="122" y="418" font-size="13" fill="#9a3412">📁 pptx</text>
  <text x="122" y="442" font-size="13" fill="#9a3412">📁 xlsx</text>
  <text x="196" y="370" font-size="12" font-weight="bold" fill="#c2410c">─ 📄 LICENSE.txt</text>
  <text x="196" y="394" font-size="12" font-weight="bold" fill="#c2410c">─ 📄 LICENSE.txt</text>
  <text x="196" y="418" font-size="12" font-weight="bold" fill="#c2410c">─ 📄 LICENSE.txt</text>
  <text x="196" y="442" font-size="12" font-weight="bold" fill="#c2410c">─ 📄 LICENSE.txt</text>

  <!-- source-available 説明パネル -->
  <rect x="428" y="344" width="272" height="132" rx="8" fill="#fff1f2" stroke="#fb923c" stroke-width="1.5"/>
  <text x="444" y="372" font-size="14" font-weight="bold" fill="#b45309">独自ライセンス（source-available）</text>
  <text x="444" y="400" font-size="12.5" fill="#9a3412">ソースは閲覧できるが、</text>
  <text x="444" y="420" font-size="12.5" fill="#9a3412">持ち出し・複製・改変・配布は</text>
  <text x="444" y="440" font-size="12.5" fill="#9a3412">明確に禁止されている</text>
  <line x1="404" y1="410" x2="428" y2="410" stroke="#fb923c" stroke-width="1.5"/>

  <!-- 下部メッセージ -->
  <text x="380" y="536" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">確認はリポジトリ単位ではなく、使いたいフォルダの直下まで</text>
</svg>
