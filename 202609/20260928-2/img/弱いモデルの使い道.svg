<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="'Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans CJK JP',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#ffffff"/>

  <rect x="20" y="40" width="180" height="110" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="110" y="30" text-anchor="middle" font-size="13" fill="#475569">手順書</text>
  <text x="36" y="68" font-size="14" fill="#1e293b">① 画面を開く</text>
  <rect x="32" y="80" width="156" height="28" rx="4" fill="#fffbeb" stroke="#d97706" stroke-dasharray="5 4"/>
  <text x="110" y="99" text-anchor="middle" font-size="12" fill="#b45309">書かれていない前提</text>
  <text x="36" y="134" font-size="14" fill="#1e293b">③ 設定を保存する</text>

  <line x1="200" y1="95" x2="240" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="245" y="60" width="160" height="70" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="325" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">強いモデル</text>
  <text x="325" y="112" text-anchor="middle" font-size="13" fill="#334155">抜けを推測で補う</text>

  <line x1="405" y1="95" x2="445" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="450" y="60" width="290" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="595" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">最後まで完了する</text>
  <text x="595" y="112" text-anchor="middle" font-size="13" fill="#475569">抜けがあったことは表に出ない</text>

  <rect x="20" y="210" width="180" height="110" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="110" y="200" text-anchor="middle" font-size="13" fill="#475569">同じ手順書</text>
  <text x="36" y="238" font-size="14" fill="#1e293b">① 画面を開く</text>
  <rect x="32" y="250" width="156" height="28" rx="4" fill="#fffbeb" stroke="#d97706" stroke-dasharray="5 4"/>
  <text x="110" y="269" text-anchor="middle" font-size="12" fill="#b45309">書かれていない前提</text>
  <text x="36" y="304" font-size="14" fill="#1e293b">③ 設定を保存する</text>

  <line x1="200" y1="265" x2="240" y2="265" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="245" y="230" width="160" height="70" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="325" y="259" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">弱いモデル</text>
  <text x="325" y="282" text-anchor="middle" font-size="13" fill="#334155">抜けを補えない</text>

  <line x1="405" y1="265" x2="445" y2="265" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="450" y="230" width="290" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="595" y="259" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">抜けの箇所で止まる</text>
  <text x="595" y="282" text-anchor="middle" font-size="13" fill="#92400e">足りない情報のありかが分かる</text>
</svg>
