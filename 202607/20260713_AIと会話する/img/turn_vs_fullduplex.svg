<svg width="680" height="490" viewBox="0 0 680 490" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>従来のターン制音声対話とGPT-Liveの全二重対話の比較(時間軸・重なり付き)</title>
  <desc>上段は従来方式で、ユーザーの発話後に間を置いてAIが応答するターンが2回繰り返される。下段はGPT-Liveで、ユーザーの発話とAIの相槌・応答が時間的に重なっており、点線でその重なりが示されている。両方とも下部に時間軸がある。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="600" height="190" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="64" y="66" font-size="14" font-weight="500" fill="#2C2C2A">従来方式(ターン制)</text>
  <text x="64" y="112" font-size="12" fill="#5F5E5A">ユーザー</text>
  <text x="64" y="152" font-size="12" fill="#5F5E5A">AI</text>

  <rect x="170" y="100" width="90" height="24" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <rect x="290" y="140" width="120" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <line x1="260" y1="95" x2="260" y2="168" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="290" y1="95" x2="290" y2="168" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="275" y="183" font-size="12" fill="#5F5E5A" text-anchor="middle">待ち</text>

  <rect x="440" y="100" width="60" height="24" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <rect x="520" y="140" width="100" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>

  <line x1="170" y1="200" x2="615" y2="200" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="628" y="204" font-size="12" fill="#5F5E5A">時間</text>

  <rect x="40" y="250" width="600" height="200" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="64" y="276" font-size="14" font-weight="500" fill="#2C2C2A">GPT-Live(全二重)</text>
  <text x="64" y="322" font-size="12" fill="#5F5E5A">ユーザー</text>
  <text x="64" y="362" font-size="12" fill="#5F5E5A">AI</text>

  <rect x="170" y="310" width="90" height="24" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <rect x="270" y="310" width="90" height="24" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <rect x="370" y="310" width="90" height="24" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <rect x="470" y="310" width="90" height="24" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>

  <rect x="280" y="350" width="40" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="520" y="350" width="100" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>

  <line x1="280" y1="334" x2="280" y2="350" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="320" y1="334" x2="320" y2="350" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="520" y1="334" x2="520" y2="350" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="560" y1="334" x2="560" y2="350" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>

  <line x1="170" y1="410" x2="615" y2="410" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="628" y="414" font-size="12" fill="#5F5E5A">時間</text>

  <rect x="60" y="460" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="82" y="471" font-size="12" fill="#2C2C2A">ユーザーが話す</text>
  <rect x="230" y="460" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="252" y="471" font-size="12" fill="#2C2C2A">AIが話す(相槌・応答)</text>
</svg>
