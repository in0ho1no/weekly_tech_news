<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="'Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans CJK JP',sans-serif">
  <rect width="760" height="480" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">定義ファイルの中身</text>
  <rect x="30" y="52" width="390" height="402" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="46" y="78" font-size="13" font-family="'Consolas','Menlo','Noto Sans Mono CJK JP','Noto Sans CJK JP',monospace" fill="#94a3b8">---</text>
  <text x="46" y="108" font-size="13" font-family="'Consolas','Menlo','Noto Sans Mono CJK JP','Noto Sans CJK JP',monospace" fill="#4338ca" font-weight="bold">name:<tspan fill="#1e293b" font-weight="normal"> Code Researcher</tspan></text>
  <text x="46" y="152" font-size="13" font-family="'Consolas','Menlo','Noto Sans Mono CJK JP','Noto Sans CJK JP',monospace" fill="#4338ca" font-weight="bold">description:<tspan fill="#1e293b" font-weight="normal"> コードを読むだけの調査…</tspan></text>
  <text x="46" y="196" font-size="13" font-family="'Consolas','Menlo','Noto Sans Mono CJK JP','Noto Sans CJK JP',monospace" fill="#4338ca" font-weight="bold">tools:<tspan fill="#1e293b" font-weight="normal"> ['read', 'search']</tspan></text>
  <text x="46" y="240" font-size="13" font-family="'Consolas','Menlo','Noto Sans Mono CJK JP','Noto Sans CJK JP',monospace" fill="#4338ca" font-weight="bold">model:<tspan fill="#1e293b" font-weight="normal"> claude-haiku-4.5</tspan></text>
  <text x="46" y="284" font-size="13" font-family="'Consolas','Menlo','Noto Sans Mono CJK JP','Noto Sans CJK JP',monospace" fill="#4338ca" font-weight="bold">user-invocable:<tspan fill="#1e293b" font-weight="normal"> false</tspan></text>
  <text x="46" y="328" font-size="13" font-family="'Consolas','Menlo','Noto Sans Mono CJK JP','Noto Sans CJK JP',monospace" fill="#94a3b8">---</text>
  <text x="46" y="388" font-size="13" font-family="'Consolas','Menlo','Noto Sans Mono CJK JP','Noto Sans CJK JP',monospace" fill="#475569">指定されたテーマについて、</text>
  <text x="46" y="412" font-size="13" font-family="'Consolas','Menlo','Noto Sans Mono CJK JP','Noto Sans CJK JP',monospace" fill="#475569">ファイルを変更せずに調べてください。</text>
  <text x="46" y="436" font-size="13" font-family="'Consolas','Menlo','Noto Sans Mono CJK JP','Noto Sans CJK JP',monospace" fill="#475569">関係するファイルのパスと…</text>
  <line x1="426" y1="90" x2="426" y2="160" stroke="#6366f1" stroke-width="3"/>
  <line x1="430" y1="125.0" x2="452" y2="125.0" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="460" y="122.0" font-size="14" font-weight="bold" fill="#1e293b">名前と、任せる場面</text>
  <text x="460" y="140.0" font-size="12" fill="#475569">descriptionは「Copilot」のセッションで必須</text>
  <line x1="426" y1="178" x2="426" y2="204" stroke="#6366f1" stroke-width="3"/>
  <line x1="430" y1="191.0" x2="452" y2="191.0" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="460" y="188.0" font-size="14" font-weight="bold" fill="#1e293b">使えるツールを絞る</text>
  <text x="460" y="206.0" font-size="12" fill="#475569">ここに書いたツールしか使えない</text>
  <line x1="426" y1="222" x2="426" y2="248" stroke="#6366f1" stroke-width="3"/>
  <line x1="430" y1="235.0" x2="452" y2="235.0" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="460" y="232.0" font-size="14" font-weight="bold" fill="#1e293b">動くモデルを決める</text>
  <text x="460" y="250.0" font-size="12" fill="#475569">省略すると選択中のモデル</text>
  <line x1="426" y1="266" x2="426" y2="292" stroke="#6366f1" stroke-width="3"/>
  <line x1="430" y1="279.0" x2="452" y2="279.0" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="460" y="276.0" font-size="14" font-weight="bold" fill="#1e293b">選択欄に出さない</text>
  <text x="460" y="294.0" font-size="12" fill="#475569">サブエージェント専用にする</text>
  <line x1="426" y1="370" x2="426" y2="444" stroke="#6366f1" stroke-width="3"/>
  <line x1="430" y1="407.0" x2="452" y2="407.0" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="460" y="404.0" font-size="14" font-weight="bold" fill="#1e293b">エージェントへの指示</text>
  <text x="460" y="422.0" font-size="12" fill="#475569">フロントマターより下の本文</text>
</svg>
