  <rect x="30" y="52" width="390" height="358" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="46" y="78" font-size="13" font-family="'Consolas','Menlo','Noto Sans Mono CJK JP','Noto Sans CJK JP',monospace" fill="#94a3b8">---</text>
  <text x="46" y="108" font-size="13" font-family="'Consolas','Menlo','Noto Sans Mono CJK JP','Noto Sans CJK JP',monospace" fill="#4338ca" font-weight="bold">name:<tspan fill="#1e293b" font-weight="normal"> code-researcher</tspan></text>
  <text x="46" y="152" font-size="13" font-family="'Consolas','Menlo','Noto Sans Mono CJK JP','Noto Sans CJK JP',monospace" fill="#4338ca" font-weight="bold">description:<tspan fill="#1e293b" font-weight="normal"> コードを読むだけの調査…</tspan></text>
  <text x="46" y="196" font-size="13" font-family="'Consolas','Menlo','Noto Sans Mono CJK JP','Noto Sans CJK JP',monospace" fill="#4338ca" font-weight="bold">tools:<tspan fill="#1e293b" font-weight="normal"> Read, Glob, Grep</tspan></text>
  <text x="46" y="240" font-size="13" font-family="'Consolas','Menlo','Noto Sans Mono CJK JP','Noto Sans CJK JP',monospace" fill="#4338ca" font-weight="bold">model:<tspan fill="#1e293b" font-weight="normal"> haiku</tspan></text>
  <text x="46" y="284" font-size="13" font-family="'Consolas','Menlo','Noto Sans Mono CJK JP','Noto Sans CJK JP',monospace" fill="#94a3b8">---</text>
  <text x="46" y="344" font-size="13" font-family="'Consolas','Menlo','Noto Sans Mono CJK JP','Noto Sans CJK JP',monospace" fill="#475569">指定されたテーマについて、</text>
  <text x="46" y="368" font-size="13" font-family="'Consolas','Menlo','Noto Sans Mono CJK JP','Noto Sans CJK JP',monospace" fill="#475569">ファイルを変更せずに調べてください。</text>
  <text x="46" y="392" font-size="13" font-family="'Consolas','Menlo','Noto Sans Mono CJK JP','Noto Sans CJK JP',monospace" fill="#475569">関係するファイルのパスと…</text>
  <line x1="426" y1="90" x2="426" y2="160" stroke="#6366f1" stroke-width="3"/>
  <line x1="430" y1="125.0" x2="452" y2="125.0" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="460" y="122.0" font-size="14" font-weight="bold" fill="#1e293b">名前と、任せる場面</text>
  <text x="460" y="140.0" font-size="12" fill="#475569">Claudeはdescriptionを見て任せるか決める</text>
  <line x1="426" y1="178" x2="426" y2="204" stroke="#6366f1" stroke-width="3"/>
  <line x1="430" y1="191.0" x2="452" y2="191.0" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="460" y="188.0" font-size="14" font-weight="bold" fill="#1e293b">使えるツールを絞る</text>
  <text x="460" y="206.0" font-size="12" fill="#475569">ここに書いたツールしか使えない</text>
  <line x1="426" y1="222" x2="426" y2="248" stroke="#6366f1" stroke-width="3"/>
  <line x1="430" y1="235.0" x2="452" y2="235.0" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="460" y="232.0" font-size="14" font-weight="bold" fill="#1e293b">動くモデルを決める</text>
  <text x="460" y="250.0" font-size="12" fill="#475569">省略するとメインの会話のモデル</text>
  <line x1="426" y1="326" x2="426" y2="400" stroke="#6366f1" stroke-width="3"/>
  <line x1="430" y1="363.0" x2="452" y2="363.0" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3 3"/>
